version: '3.8'

services:
  # 1. Database (PostgreSQL)
  travel-db:
    image: postgres:15-alpine
    container_name: travel-db
    restart: always
    environment:
      POSTGRES_DB: chinatravel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - travel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend API (Đã thêm cấu hình build)
  travel-api:
    build: .   # Hoặc đổi thành đường dẫn chứa Dockerfile của backend nếu nằm trong thư mục con (ví dụ: build: ./backend)
    image: chinatravel1-api:latest
    container_name: travel-api
    restart: always
    depends_on:
      travel-db:
        condition: service_healthy
    networks:
      - travel-net

  # 3. Frontend Webapp
  travel-web:
    build: .
    image: chinatravel1-frontend:latest
    container_name: chinatravel1-frontend
    restart: always
    ports:
      - "8080:8080"
    networks:
      - travel-net

  # 4. Cloudflare Tunnel
  travel-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: travel-tunnel
    restart: always
    command: tunnel run --token ${TUNNEL_TOKEN}
    networks:
      - travel-net

volumes:
  pgdata:

networks:
  travel-net:
    driver: bridge